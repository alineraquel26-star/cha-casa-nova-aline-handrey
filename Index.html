<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chá de Casa Nova — Aline & Handrey</title><style>body{margin:0;background:#f7f3ee;color:#292522;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}header{text-align:center;padding:30px 16px 18px}h1{margin:0 0 6px}.wrap{max-width:900px;margin:auto;padding:0 16px 40px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}.badge,.btn{border-radius:10px;padding:10px 13px}.badge{background:#eee5dc}.btn{border:0;background:#8a6a52;color:#fff;font-weight:600;cursor:pointer}.btn.gray{background:#eee5dc;color:#292522}.btn.red{background:#a65353}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card,.box{background:#fff;border:1px solid #e7ddd3;border-radius:16px;padding:16px}.card h3{margin:0 0 6px}.price,small{color:#756d66}.card a{color:#8a6a52}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:16px}.modal.on{display:flex}.box{width:min(420px,100%)}input{display:block;width:100%;box-sizing:border-box;padding:12px;border:1px solid #e7ddd3;border-radius:10px;margin:8px 0 12px;font-size:16px}.admin{display:none}.admin.on{display:block}.section{background:#fff;border:1px solid #e7ddd3;border-radius:16px;padding:16px;margin:12px 0}.notice{padding:10px;background:#f4eee8;border-radius:10px;margin:8px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.hidden{display:none}</style></head><body><header><h1>🏠 Chá de Casa Nova</h1><div>Aline & Handrey</div><div>Escolha seu presente e reserve 🤎</div></header><main class="wrap"><div class="top"><span class="badge" id="count">Carregando...</span><button class="btn gray" onclick="adminOpen()">🔐 Administrador</button></div><section id="public"><div id="grid" class="grid"></div></section><section id="admin" class="admin"><div class="section" id="login"><h2>🔐 Administradora</h2><input id="email" type="email" placeholder="E-mail"><input id="pass" type="password" placeholder="Senha"><button class="btn" onclick="login()">Entrar</button><p id="loginMsg"></p></div><div id="panel" class="hidden"><div class="top"><b>Painel de presentes</b><button class="btn gray" onclick="logout()">Sair</button></div><div class="section"><h3>Adicionar presente</h3><input id="nn" placeholder="Nome"><input id="np" placeholder="Preço"><input id="nu" placeholder="Link"><button class="btn" onclick="addGift()">Adicionar</button></div><div class="section"><h3>Presentes</h3><div id="ag"></div></div><div class="section"><h3>Reservas</h3><div id="ar"></div></div></div></section></main><div id="modal" class="modal"><div class="box"><h2>🎁 Reservar presente</h2><p id="mg"></p><input id="gn" maxlength="80" placeholder="Seu nome"><div class="row"><button class="btn" onclick="reserve()">Confirmar</button><button class="btn gray" onclick="closeM()">Cancelar</button></div><p id="rm"></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const U='https://tawgiixpqirmeqwstiyw.supabase.co',K='sb_publishable_D2hYVxnUZ09TfpqWuq8p1w_CH2a6-zh',S=supabase.createClient(U,K);let G=[],R=[],sel=null;const $=id=>document.getElementById(id),E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){let a=await S.from('gifts').select('*').eq('active',true).order('created_at');G=a.data||[];let b=await S.from('reservations').select('item_id');R=b.data||[];render()}function render(){let z=new Set(R.map(x=>x.item_id));$('count').textContent=`${G.filter(g=>!z.has(g.id)).length} disponíveis de ${G.length}`;$('grid').innerHTML=G.map(g=>`<div class="card"><h3>${E(g.name)}</h3><div class="price">${E(g.price)}</div>${g.url?`<a href="${E(g.url)}" target="_blank">Ver presente ↗</a><br>`:''}${z.has(g.id)?'<b style="color:#5d7b5d">✓ Já escolhido</b>':`<button class="btn" onclick="openM('${g.id}')">Reservar presente</button>`}</div>`).join('')||'<div class="box">Nenhum presente cadastrado.</div>'}function openM(id){sel=G.find(g=>g.id===id);$('mg').textContent=sel.name;$('gn').value='';$('rm').textContent='';$('modal').classList.add('on')}function closeM(){$('modal').classList.remove('on')}async function reserve(){let n=$('gn').value.trim();if(!n)return $('rm').textContent='Digite seu nome.';let q=await S.from('reservations').insert({item_id:sel.id,item_name:sel.name,guest_name:n});if(q.error){$('rm').textContent='Esse presente já pode ter sido reservado. Atualize a página.';return}closeM();load()}function adminOpen(){$('public').classList.add('hidden');$('admin').classList.add('on');scrollTo(0,0)}async function login(){let q=await S.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});if(q.error)return $('loginMsg').textContent=q.error.message;$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadAdmin()}async function logout(){await S.auth.signOut();$('login').classList.remove('hidden');$('panel').classList.add('hidden')}async function loadAdmin(){let a=await S.from('gifts').select('*').order('created_at');G=a.data||[];let b=await S.from('reservations').select('*').order('created_at',{ascending:false});R=b.data||[];$('ag').innerHTML=G.map(g=>`<div class="notice"><b>${E(g.name)}</b><br><small>${E(g.price)} · ${g.active?'Ativo':'Desativado'}</small><div class="row"><button class="btn gray" onclick="editG('${g.id}')">Editar</button><button class="btn gray" onclick="toggleG('${g.id}',${!g.active})">${g.active?'Desativar':'Ativar'}</button><button class="btn red" onclick="delG('${g.id}')">Excluir</button></div></div>`).join('')||'<small>Nenhum presente.</small>';$('ar').innerHTML=R.map(r=>`<div class="notice"><b>${E(r.item_name)}</b><br>Reservado por: ${E(r.guest_name)}<br><small>${new Date(r.created_at).toLocaleString('pt-BR')}</small><div class="row"><button class="btn red" onclick="delR('${r.id}')">Cancelar reserva</button></div></div>`).join('')||'<small>Nenhuma reserva.</small>'}async function addGift(){let n=$('nn').value.trim();if(!n)return alert('Informe o nome.');let q=await S.from('gifts').insert({name:n,price:$('np').value.trim(),url:$('nu').value.trim(),active:true});if(q.error)alert(q.error.message);else{$('nn').value=$('np').value=$('nu').value='';loadAdmin();load()}}async function editG(id){let g=G.find(x=>x.id===id),n=prompt('Nome:',g.name);if(n===null)return;let p=prompt('Preço:',g.price||'');if(p===null)return;let u=prompt('Link:',g.url||'');if(u===null)return;let q=await S.from('gifts').update({name:n.trim(),price:p.trim(),url:u.trim()}).eq('id',id);if(q.error)alert(q.error.message);else{loadAdmin();load()}}async function toggleG(id,v){let q=await S.from('gifts').update({active:v}).eq('id',id);if(q.error)alert(q.error.message);else{loadAdmin();load()}}async function delG(id){if(!confirm('Excluir este presente?'))return;let q=await S.from('gifts').delete().eq('id',id);if(q.error)alert(q.error.message);else{loadAdmin();load()}}async function delR(id){if(!confirm('Cancelar esta reserva?'))return;let q=await S.from('reservations').delete().eq('id',id);if(q.error)alert(q.error.message);else{loadAdmin();load()}}load();</script></body></html>
